<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PodCut</title>
    <script>try{const q=new URLSearchParams(location.search).get('theme');const t=q==='light'||q==='dark'?q:localStorage.getItem('podcut:theme');document.documentElement.dataset.theme=t==='dark'?'dark':'light';}catch{document.documentElement.dataset.theme='light';}</script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
